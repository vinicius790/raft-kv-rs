[package]
name = "raft-kv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
raft-mvp = { path = ".." }

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_rpc"
path = "fuzz_targets/decode_rpc.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]
