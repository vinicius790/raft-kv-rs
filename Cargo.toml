[package]
name = "raft-kv-rs"
version = "1000000.0.0"
edition = "2021"
authors = ["Geraliza Castlevania"]
description = "Didactic Raft: joint membership, chunked snapshots with checksum, read index, check quorum, protocol trace, session client (tokio + TCP)"
license = "MIT"
readme = "README.md"
keywords = ["raft", "consensus", "distributed", "tokio", "kv"]
categories = ["network-programming", "database-implementations"]
repository = "https://github.com/vinicius790/raft-kv-rs"
homepage = "https://github.com/vinicius790/raft-kv-rs"

[[bin]]
name = "raft-node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "test-util"] }
turmoil = "0.7.2"

[profile.release]
lto = true
codegen-units = 1

[features]
# Mutual TLS between nodes (rustls 0.23, ring provider).
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-webpki", "dep:rustls-pki-types"]
