[package]
name = "raft-kv-rs"
version = "1000000.0.0"
edition = "2021"
authors = ["Geraliza Castlevania"]
description = "Didactic Raft: joint membership, chunked snapshots with checksum, read index, check quorum, protocol trace, session client (tokio + TCP)"
license = "MIT"
readme = "README.md"
keywords = ["raft", "consensus", "distributed", "tokio", "kv"]
categories = ["network-programming", "database-implementations"]
repository = "https://github.com/vinicius790/raft-kv-rs"
homepage = "https://github.com/vinicius790/raft-kv-rs"

[[bin]]
name = "raft-node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
metrics = { version = "0.24", default-features = false }
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "test-util"] }

[profile.release]
lto = true
codegen-units = 1
