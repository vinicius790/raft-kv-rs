# Three-node raft-kv-rs cluster. See docs/ARCHITECTURE.md §8.
x-node: &node
  build: .
  image: raft-kv-rs:local
  restart: unless-stopped
  environment:
    RUST_LOG: raft_kv_rs=info

services:
  n1:
    <<: *node
    command: ["serve", "--id", "1", "--bind", "0.0.0.0:7000",
              "--peers", "2=172.28.0.12:7000,3=172.28.0.13:7000", "--data-dir", "/data"]
    volumes: ["n1:/data"]
    networks: { raft: { ipv4_address: 172.28.0.11 } }
  n2:
    <<: *node
    command: ["serve", "--id", "2", "--bind", "0.0.0.0:7000",
              "--peers", "1=172.28.0.11:7000,3=172.28.0.13:7000", "--data-dir", "/data"]
    volumes: ["n2:/data"]
    networks: { raft: { ipv4_address: 172.28.0.12 } }
  n3:
    <<: *node
    command: ["serve", "--id", "3", "--bind", "0.0.0.0:7000",
              "--peers", "1=172.28.0.11:7000,2=172.28.0.12:7000", "--data-dir", "/data"]
    volumes: ["n3:/data"]
    networks: { raft: { ipv4_address: 172.28.0.13 } }

networks:
  raft:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]

volumes:
  n1:
  n2:
  n3:
